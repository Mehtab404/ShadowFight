name: Shadow Ronin CI

on:
  push:
    branches: [ main, feat/* ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Validate Git LFS tracking
        run: |
          git lfs status

      - name: Validate File Structure
        run: |
          test -f project.godot
          test -f export_presets.cfg
          test -f web/index.html
          test -f docs/index.html
          test -f docs/GDD.md
          test -f docs/frame_data.csv
          test -d src/combat
          test -d src/characters
          test -d src/ai
          test -d src/ui
          test -d src/core
          test -d src/vfx
          echo "All structural tests passed."

  deploy-pages:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
